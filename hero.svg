<svg width="1200" height="420" viewBox="0 0 1200 420"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080707"/>
      <stop offset="45%" stop-color="#140D0F"/>
      <stop offset="100%" stop-color="#3A1D24"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#8B5E5E" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#8B5E5E" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A252D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A06A70" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#4A252D" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <filter id="soft">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <ellipse cx="600" cy="210" rx="430" ry="180"
           fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="rx"
             values="430;500;430"
             dur="7s"
             repeatCount="indefinite"/>
    <animate attributeName="opacity"
             values=".65;.9;.65"
             dur="7s"
             repeatCount="indefinite"/>
  </ellipse>

  <!-- Animated waves -->
  <g fill="none" stroke="url(#wave)" stroke-width="2">

    <path d="M-100 300 C180 120 350 430 620 230
             C850 60 1000 250 1300 100">
      <animate attributeName="d"
        dur="9s"
        repeatCount="indefinite"
        values="
        M-100 300 C180 120 350 430 620 230 C850 60 1000 250 1300 100;
        M-100 240 C180 390 370 80 620 270 C850 450 1020 100 1300 190;
        M-100 300 C180 120 350 430 620 230 C850 60 1000 250 1300 100"/>
    </path>

    <path d="M-100 350 C200 180 370 450 650 260
             C900 90 1050 290 1300 150"
          opacity=".45">
      <animate attributeName="d"
        dur="11s"
        repeatCount="indefinite"
        values="
        M-100 350 C200 180 370 450 650 260 C900 90 1050 290 1300 150;
        M-100 280 C200 430 400 100 650 300 C900 460 1050 120 1300 220;
        M-100 350 C200 180 370 450 650 260 C900 90 1050 290 1300 150"/>
    </path>

  </g>

  <!-- Subtle grid -->
  <g opacity=".07" stroke="#FFFFFF">
    <path d="M0 70 H1200"/>
    <path d="M0 140 H1200"/>
    <path d="M0 280 H1200"/>
    <path d="M0 350 H1200"/>
    <path d="M150 0 V420"/>
    <path d="M300 0 V420"/>
    <path d="M900 0 V420"/>
    <path d="M1050 0 V420"/>
  </g>

  <!-- Accent line -->
  <rect x="500" y="92" width="200" height="2" rx="1"
        fill="#A06A70">
    <animate attributeName="width"
             values="120;240;120"
             dur="4s"
             repeatCount="indefinite"/>
    <animate attributeName="x"
             values="540;480;540"
             dur="4s"
             repeatCount="indefinite"/>
  </rect>

  <!-- Main identity -->
  <text x="600" y="175"
        text-anchor="middle"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="58"
        font-weight="700"
        letter-spacing="8">
    AMAL MANSOUR
  </text>

  <text x="600" y="220"
        text-anchor="middle"
        fill="#C69A9F"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        font-weight="600"
        letter-spacing="5">
    REACT-FOCUSED FULL-STACK DEVELOPER
  </text>

  <!-- Animated role -->
  <text x="600" y="270"
        text-anchor="middle"
        fill="#D8D0D0"
        font-family="monospace"
        font-size="15">
    React.js  •  Node.js  •  REST APIs  •  MongoDB
  </text>

  <!-- Small terminal-style indicator -->
  <g transform="translate(515 305)">
    <circle cx="8" cy="8" r="4" fill="#A06A70">
      <animate attributeName="opacity"
               values="1;.25;1"
               dur="1.6s"
               repeatCount="indefinite"/>
    </circle>

    <text x="22" y="13"
          fill="#8F8587"
          font-family="monospace"
          font-size="12">
      building thoughtful digital experiences
    </text>
  </g>

</svg>
